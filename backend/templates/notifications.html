<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уведомления - TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Тосты -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">TaskFlow</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage">Сообщение</div>
        </div>
    </div>

    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/projects">TaskFlow</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text text-light me-3" id="userName">Пользователь</span>
                <a href="/notifications" class="btn btn-outline-light me-2" id="notificationsBtn">
                    🔔 Уведомления
                    <span id="unreadBadge" class="badge bg-danger" style="display: none;">0</span>
                </a>
                <a href="/projects" class="btn btn-outline-light me-2">← Назад</a>
                <button class="btn btn-outline-light" id="logoutBtn">Выйти</button>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Уведомления</h1>
            <button class="btn btn-outline-secondary" id="selectAllBtn">☑ Выделить все</button>
        </div>

        <!-- Фильтр -->
        <div class="row mb-3">
            <div class="col-md-4">
                <select class="form-select" id="filterStatus">
                    <option value="all">Все уведомления</option>
                    <option value="unread">Непрочитанные</option>
                    <option value="read">Прочитанные</option>
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-outline-secondary w-100" id="resetFilterBtn">Сбросить</button>
            </div>
            <div class="col-md-6 text-end">
                <span id="selectedCount" class="text-muted me-2">Выделено: 0</span>
                <button class="btn btn-sm btn-success" id="bulkMarkReadBtn" style="display: none;">✅ Прочитать</button>
                <button class="btn btn-sm btn-danger" id="bulkDeleteBtn" style="display: none;">🗑 Удалить</button>
            </div>
        </div>

        <!-- Список -->
        <div id="notificationsList" class="list-group">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Загрузка...</span>
                </div>
            </div>
        </div>

        <!-- Пагинация -->
        <div id="paginationContainer" class="d-flex justify-content-center mt-4"></div>
    </div>

    <!-- Модалка подтверждения удаления -->
    <div class="modal fade" id="confirmDeleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Подтверждение удаления</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Вы уверены, что хотите удалить <strong id="deleteCountText">выбранные</strong> уведомления?</p>
                    <p class="text-danger">Это действие нельзя отменить.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Удалить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка выхода -->
    <div class="modal fade" id="confirmLogoutModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Подтверждение выхода</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Вы уверены, что хотите выйти из учётной записи?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-danger" id="confirmLogoutBtn">Выйти</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/notifications.js"></script>
</body>
</html>
