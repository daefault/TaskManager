<!-- templates/projects.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проекты - TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Контейнер для тостов -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">TaskFlow</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage">Сообщение</div>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/projects">TaskFlow</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text text-light me-3" id="userName">Пользователь</span>
                <button class="btn btn-outline-light" id="logoutBtn">Выйти</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Мои проекты</h1>
            <button class="btn btn-primary" id="createProjectBtn">+ Новый проект</button>
        </div>

        <!-- Поиск и фильтры -->
        <div class="row mb-3">
            <div class="col-md-5">
                <div class="input-group">
                    <input type="text" class="form-control" id="searchProjectsInput" placeholder="Поиск по названию...">
                    <button class="btn btn-primary" id="searchProjectsBtn">🔍 Найти</button>
                    <button class="btn btn-outline-secondary" id="clearSearchBtn" style="display: none;">✕</button>
                </div>
            </div>
            <div class="col-md-3">
                <select class="form-select" id="filterStatus">
                    <option value="">Все статусы</option>
                    <option value="active">Активные</option>
                    <option value="archived">Архивные</option>
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-outline-secondary w-100" id="resetFiltersBtn">Сбросить</button>
            </div>
        </div>

        <div id="projectsList" class="row">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Загрузка...</span>
                </div>
            </div>
        </div>

        <!-- Пагинация -->
        <div id="paginationContainer" class="d-flex justify-content-center mt-4"></div>
    </div>

    <!-- Модалка создания проекта -->
    <div class="modal fade" id="createProjectModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Новый проект</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createProjectForm">
                        <div class="mb-3">
                            <label for="projectName" class="form-label">Название</label>
                            <input type="text" class="form-control" id="projectName" required>
                            <div class="invalid-feedback" id="nameError"></div>
                        </div>
                        <div class="mb-3">
                            <label for="projectDescription" class="form-label">Описание</label>
                            <textarea class="form-control" id="projectDescription" rows="3"></textarea>
                            <div class="invalid-feedback" id="descriptionError"></div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Создать</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="confirmLogoutModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Подтверждение выхода</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Вы уверены, что хотите выйти из учётной записи?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-danger" id="confirmLogoutBtn">Выйти</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/projects.js"></script>
    <script src="/static/js/utils.js"></script>
</body>
</html>
